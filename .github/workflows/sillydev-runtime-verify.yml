name: Verify ASHUR server startup and state

on:
  push:
    branches: [ashur-live-shadow]
    paths:
      - ".github/workflows/sillydev-runtime-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read server state and startup command
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
        run: |
          set -euo pipefail
          for endpoint in servers startup; do
            echo "===== GET $endpoint ====="
            curl --fail-with-body --silent --show-error \
              "https://sillydev.co.uk/panel/api/client/${endpoint}/${SILLYDEV_SERVER_ID}" \
              -H "Authorization: Bearer ${SILLYDEV_API_KEY}" \
              -H "Accept: application/json" | python -m json.tool
          done
          echo "===== GET resources ====="
          curl --fail-with-body --silent --show-error \
            "https://sillydev.co.uk/panel/api/client/servers/${SILLYDEV_SERVER_ID}/resources" \
            -H "Authorization: Bearer ${SILLYDEV_API_KEY}" \
            -H "Accept: application/json" | python -m json.tool
