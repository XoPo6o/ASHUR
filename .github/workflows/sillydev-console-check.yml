name: Read ASHUR console diagnostics

on:
  push:
    branches: [ashur-live-shadow]
    paths:
      - ".github/workflows/sillydev-console-check.yml"

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - name: Read server state and collect console output
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://sillydev.co.uk/panel/api/client/servers/${SILLYDEV_SERVER_ID}/resources" \
            -H "Authorization: Bearer ${SILLYDEV_API_KEY}" -H "Accept: application/json" | python -m json.tool

          base="https://sillydev.co.uk/panel/api/client/servers/${SILLYDEV_SERVER_ID}/websocket/relay"
          curl --fail-with-body --silent --show-error -X POST "$base" \
            -H "Authorization: Bearer ${SILLYDEV_API_KEY}" -H "Accept: application/json" > /tmp/relay.json
          session=$(python -c 'import json; print(json.load(open("/tmp/relay.json"))["data"]["session"])')
          cleanup() {
            curl --silent --show-error -X DELETE "$base/$session" \
              -H "Authorization: Bearer ${SILLYDEV_API_KEY}" -H "Accept: application/json" >/dev/null || true
          }
          trap cleanup EXIT
          curl --fail-with-body --silent --show-error -X POST "$base/$session/send" \
            -H "Authorization: Bearer ${SILLYDEV_API_KEY}" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            --data '{"event":"send logs"}' >/dev/null

          after=0
          for attempt in $(seq 1 10); do
            curl --fail-with-body --silent --show-error "$base/$session?after=$after" \
              -H "Authorization: Bearer ${SILLYDEV_API_KEY}" -H "Accept: application/json" > /tmp/console.json
            python - <<'PY'
          import json
          d=json.load(open("/tmp/console.json"))["data"]
          for e in d.get("events", []):
              n=e.get("event")
              a=e.get("args") or []
              if n in ("status","console output","daemon error","jwt error","throttled"):
                  print(n + (": " + " ".join(a) if a else ""))
          print("LAST_ID=" + str(max([e.get("id", 0) for e in d.get("events", [])], default=0)))
          PY
            next_after=$(python -c 'import json; d=json.load(open("/tmp/console.json"))["data"]; print(max([e.get("id",0) for e in d.get("events",[])],default=0))')
            if [ "$next_after" -gt "$after" ]; then after="$next_after"; fi
            sleep 2
          done
