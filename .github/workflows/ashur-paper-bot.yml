name: ASHUR Paper Trading Worker
run-name: ASHUR paper cycle · 5m strategy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ashur-paper-bot.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ashur-paper-trading
  cancel-in-progress: false

jobs:
  paper-trading:
    name: Run autonomous paper trading cycle
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout ASHUR trading branch
        uses: actions/checkout@v4
        with:
          ref: mvp-paper-trading
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check ccxt pandas

      - name: Run autonomous paper trading cycle
        env:
          PYTHONUNBUFFERED: "1"
        run: python trading-lab/bot_worker.py

      - name: Persist paper account and trade ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f trading-lab/ashur_paper.db
          if git diff --cached --quiet; then
            echo "No database changes to persist."
          else
            git commit -m "Update ASHUR paper trading ledger"
            git push origin HEAD:mvp-paper-trading
          fi
