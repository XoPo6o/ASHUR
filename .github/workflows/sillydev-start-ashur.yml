name: Start ASHUR paper daemon

on:
  push:
    branches: [ashur-live-shadow]
    paths:
      - ".github/workflows/sillydev-start-ashur.yml"

permissions:
  contents: read

jobs:
  start-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Start ASHUR and verify running state
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
        run: |
          set -euo pipefail
          echo "===== START SERVER ====="
          code=$(curl --silent --show-error --output /tmp/start-response.json --write-out "%{http_code}" -X POST \
            "https://sillydev.co.uk/panel/api/client/servers/${SILLYDEV_SERVER_ID}/power" \
            -H "Authorization: Bearer ${SILLYDEV_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{"signal":"start"}')
          echo "START_HTTP_STATUS=$code"
          if [ "$code" != "204" ]; then cat /tmp/start-response.json; exit 1; fi

          echo "===== WAIT FOR RUNNING ====="
          for attempt in $(seq 1 24); do
            curl --fail-with-body --silent --show-error \
              "https://sillydev.co.uk/panel/api/client/servers/${SILLYDEV_SERVER_ID}/resources" \
              -H "Authorization: Bearer ${SILLYDEV_API_KEY}" \
              -H "Accept: application/json" > /tmp/resources.json
            python - <<'PY'
          import json
          d=json.load(open("/tmp/resources.json"))["attributes"]
          r=d.get("resources", {})
          print("STATE=" + d.get("current_state", "unknown"))
          print("BOOTING=" + str(d.get("is_booting")))
          print("MEMORY_BYTES=" + str(r.get("memory_bytes")))
          PY
            state=$(python -c 'import json; print(json.load(open("/tmp/resources.json"))["attributes"]["current_state"])')
            if [ "$state" = "running" ]; then exit 0; fi
            if [ "$state" = "offline" ] && [ "$attempt" -gt 3 ]; then
              echo "Server returned to offline before becoming running."
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for running state."
          exit 1
