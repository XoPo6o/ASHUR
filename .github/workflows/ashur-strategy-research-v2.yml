name: ASHUR Expanded Strategy Research
run-name: ASHUR research v2 · 2y · walk-forward · expanded models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ashur-strategy-research-v2.yml"
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

concurrency:
  group: ashur-strategy-research-v2
  cancel-in-progress: false

jobs:
  research:
    name: Test trend, momentum, breakout and mean-reversion models
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ASHUR research branch
        uses: actions/checkout@v4
        with:
          ref: mvp-paper-trading
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Run expanded 2-year strategy research
        env:
          PYTHONUNBUFFERED: "1"
        run: python trading-lab/strategy_lab_v2.py
      - name: Upload detailed research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashur-strategy-research-v2
          path: |
            trading-lab/strategy_research_v2.json
            trading-lab/strategy_research_v2.csv
          if-no-files-found: warn
          retention-days: 30
