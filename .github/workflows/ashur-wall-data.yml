name: ASHUR Wall live paper data
run-name: ASHUR Wall · publish verified Paper/Shadow snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ashur-wall-data.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ashur-wall-data-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download verified Paper/Shadow status and SQLite ledger
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SILLYDEV_API_KEY" || -z "$SILLYDEV_SERVER_ID" ]]; then
            echo "::error::SILLYDEV_API_KEY or SILLYDEV_SERVER_ID is missing."
            exit 1
          fi
          API="https://sillydev.co.uk/panel/api/client"
          AUTH=(-H "Authorization: Bearer $SILLYDEV_API_KEY" -H "Accept: application/json")
          curl --fail-with-body --silent --show-error \
            "$API/servers/$SILLYDEV_SERVER_ID/resources" "${AUTH[@]}" > /tmp/resources.json
          curl --fail-with-body --silent --show-error --get \
            --data-urlencode "file=/.local/share/ashur/ashur_shadow_status.json" \
            "$API/servers/$SILLYDEV_SERVER_ID/files/contents" "${AUTH[@]}" > /tmp/status.json
          curl --fail-with-body --silent --show-error --get \
            --data-urlencode "file=/.local/share/ashur/ashur_shadow.db" \
            "$API/servers/$SILLYDEV_SERVER_ID/files/download" "${AUTH[@]}" > /tmp/download.json
          SIGNED_URL="$(python -c 'import json; print(json.load(open("/tmp/download.json"))["attributes"]["url"])')"
          curl --fail --silent --show-error "$SIGNED_URL" -o /tmp/ashur_shadow.db

      - name: Validate source and build public dashboard data
        run: |
          python - <<'PY'
          import json, sqlite3
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          status = json.load(open("/tmp/status.json"))
          resources = json.load(open("/tmp/resources.json")).get("attributes", {})
          if resources.get("current_state") != "running":
              raise SystemExit("SillyDev server is not running")
          if status.get("mode") != "PAPER_ONLY":
              raise SystemExit("Refusing to publish: mode is not PAPER_ONLY")
          if status.get("experiment", {}).get("baseline_id") != "ashur-paper-30d-2026-11-25-v2":
              raise SystemExit("Refusing to publish: clean 30-day baseline ID mismatch")
          if len(status.get("accounts", [])) != 6:
              raise SystemExit("Refusing to publish: expected exactly six strategy accounts")
          health = status.get("worker_health", {})
          if health.get("all_strategies_ok") is not True or health.get("successful_strategies") != 6 or health.get("error_count") != 0:
              raise SystemExit("Refusing to publish: worker health is degraded")
          if health.get("all_protections_ok") is not True:
              raise SystemExit("Refusing to publish: position protection is not healthy")

          def age(value):
              if not value:
                  return None
              return (now - datetime.fromisoformat(value.replace("Z", "+00:00"))).total_seconds()

          heartbeat_age = age(status.get("updated_at"))
          if heartbeat_age is None or heartbeat_age < -60 or heartbeat_age > 900:
              raise SystemExit(f"Refusing to publish: stale worker heartbeat ({heartbeat_age})")

          account_fields = (
              "strategy_id", "symbol", "grade", "starting_cash", "cash", "equity",
              "net_pnl", "realized_pnl", "unrealized_pnl", "return_pct", "trades",
              "fees", "last_price", "last_price_at", "protection_status"
          )
          accounts = []
          for account in status["accounts"]:
              row = {key: account.get(key) for key in account_fields}
              stamp_age = age(account.get("last_price_at"))
              if stamp_age is None or stamp_age < -60 or stamp_age > 900:
                  raise SystemExit(f"Refusing to publish: stale price for {account.get('strategy_id')}")
              position = account.get("position")
              if position:
                  row["position"] = {
                      key: position.get(key)
                      for key in ("symbol", "qty", "entry", "mark", "stop", "target", "opened_at", "protection_status")
                  }
              accounts.append(row)

          db = sqlite3.connect("/tmp/ashur_shadow.db")
          db.row_factory = sqlite3.Row
          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          if integrity != "ok":
              raise SystemExit("Refusing to publish: SQLite integrity check failed")
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {"shadow_trades", "shadow_positions", "shadow_events"}
          if not required.issubset(tables):
              raise SystemExit("Refusing to publish: required ledger tables are missing")

          trade_rows = db.execute("""
              SELECT id, strategy_id, symbol, entry, exit, qty, fees, pnl, reason, opened_at, closed_at
              FROM shadow_trades ORDER BY id DESC LIMIT 300
          """).fetchall()
          trades = [dict(row) for row in trade_rows]
          trades.reverse()

          event_rows = db.execute("""
              SELECT id, created_at, strategy_id, event
              FROM shadow_events
              WHERE event IN ('OPEN','CLOSE','ERROR','INTRABAR_EXIT')
              ORDER BY id DESC LIMIT 100
          """).fetchall()
          events = [dict(row) for row in event_rows]
          events.reverse()

          open_rows = db.execute("""
              SELECT strategy_id, symbol, qty, entry, stop, target, opened_at
              FROM shadow_positions ORDER BY strategy_id
          """).fetchall()
          positions = [dict(row) for row in open_rows]

          all_trade_rows = db.execute("""
              SELECT strategy_id, pnl, fees, opened_at, closed_at
              FROM shadow_trades ORDER BY id
          """).fetchall()
          trade_stats = []
          for account in accounts:
              sid = account["strategy_id"]
              rows = [row for row in all_trade_rows if row["strategy_id"] == sid]
              wins = [float(row["pnl"] or 0) for row in rows if float(row["pnl"] or 0) > 0]
              losses = [float(row["pnl"] or 0) for row in rows if float(row["pnl"] or 0) < 0]
              gross_profit = sum(wins)
              gross_loss = abs(sum(losses))
              ordered = sorted(rows, key=lambda row: row["closed_at"] or "")
              win_streak = loss_streak = max_win_streak = max_loss_streak = 0
              for row in ordered:
                  value = float(row["pnl"] or 0)
                  if value > 0:
                      win_streak += 1
                      loss_streak = 0
                  elif value < 0:
                      loss_streak += 1
                      win_streak = 0
                  else:
                      win_streak = loss_streak = 0
                  max_win_streak = max(max_win_streak, win_streak)
                  max_loss_streak = max(max_loss_streak, loss_streak)
              trade_stats.append({
                  "strategy_id": sid,
                  "closed_trades": len(rows),
                  "wins": len(wins),
                  "losses": len(losses),
                  "flats": len(rows) - len(wins) - len(losses),
                  "win_rate_pct": (len(wins) / len(rows) * 100) if rows else None,
                  "gross_profit": round(gross_profit, 8),
                  "gross_loss": round(gross_loss, 8),
                  "profit_factor": (round(gross_profit / gross_loss, 6) if gross_loss else (None if not wins else "INF")),
                  "average_win": (round(gross_profit / len(wins), 8) if wins else None),
                  "average_loss": (round(sum(losses) / len(losses), 8) if losses else None),
                  "fees": round(sum(float(row["fees"] or 0) for row in rows), 8),
              "best_trade": (round(max((float(row["pnl"] or 0) for row in rows), default=0), 8) if rows else None),
              "worst_trade": (round(min((float(row["pnl"] or 0) for row in rows), default=0), 8) if rows else None),
              "average_hold_minutes": (round(sum((datetime.fromisoformat(row["closed_at"].replace("Z", "+00:00")) - datetime.fromisoformat(row["opened_at"].replace("Z", "+00:00"))).total_seconds() / 60 for row in rows if row["opened_at"] and row["closed_at"]) / max(1, sum(1 for row in rows if row["opened_at"] and row["closed_at"])), 2) if any(row["opened_at"] and row["closed_at"] for row in rows) else None),
              "max_win_streak": 0,
              "max_loss_streak": 0
              })

          payload = {
              "schema_version": 1,
              "generated_at": now.isoformat(),
              "source_updated_at": status.get("updated_at"),
              "source_heartbeat_age_seconds": int(heartbeat_age),
              "mode": "PAPER_ONLY",
              "server_state": resources.get("current_state"),
              "experiment": {
                  key: status.get("experiment", {}).get(key)
                  for key in ("baseline_id", "baseline_at", "starting_equity_per_strategy", "strategy_count")
              },
              "worker_health": {
                  key: health.get(key)
                  for key in ("all_strategies_ok", "successful_strategies", "error_count",
                              "all_protections_ok", "protection_degraded_positions",
                              "protection_degraded_strategies")
              },
              "accounts": accounts,
              "trade_stats": trade_stats,
              "open_positions": positions,
              "closed_trades": trades,
              "recent_events": events,
              "ledger": {
                  "integrity": integrity,
                  "closed_trades_included": len(trades),
                  "recent_events_included": len(events),
                  "total_closed_trades": db.execute("SELECT COUNT(*) FROM shadow_trades").fetchone()[0],
                  "total_events": db.execute("SELECT COUNT(*) FROM shadow_events").fetchone()[0]
              }
          }
          Path("wall-data.json").write_text(json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n")

          history_path = Path("wall-history.json")
          if history_path.exists():
              history = json.loads(history_path.read_text())
          else:
              history = {"schema_version": 1, "retention_days": 90, "points": []}
          point = {
              "generated_at": payload["generated_at"],
              "source_updated_at": payload["source_updated_at"],
              "total_equity": round(sum(float(a.get("equity") or 0) for a in accounts), 8),
              "total_net_pnl": round(sum(float(a.get("net_pnl") or 0) for a in accounts), 8),
              "closed_trades": payload["ledger"]["total_closed_trades"],
              "accounts": [{
                  "strategy_id": a["strategy_id"],
                  "equity": a.get("equity"),
                  "net_pnl": a.get("net_pnl"),
                  "return_pct": a.get("return_pct"),
                  "last_price": a.get("last_price"),
                  "symbol": a.get("symbol")
              } for a in accounts]
          }
          points = history.get("points", [])
          if not points or points[-1].get("generated_at") != point["generated_at"]:
              points.append(point)
          cutoff = now.timestamp() - 90 * 86400
          history["points"] = [
              p for p in points
              if datetime.fromisoformat(p["generated_at"].replace("Z", "+00:00")).timestamp() >= cutoff
          ][-9000:]
          history["history_started_at"] = history["points"][0]["generated_at"] if history["points"] else payload["generated_at"]
          history["last_updated_at"] = payload["generated_at"]
          Path("wall-history.json").write_text(json.dumps(history, ensure_ascii=False, separators=(",", ":")) + "\n")
          print("Verified snapshot built:", len(accounts), "strategies;", len(trades), "closed trades;", len(positions), "open positions")
          PY

      - name: Commit changed dashboard snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wall-data.json wall-history.json
          if git diff --cached --quiet; then
            echo "Dashboard data unchanged; no commit required."
            exit 0
          fi
          git commit -m "data: refresh verified ASHUR Wall paper snapshot"
          git push origin HEAD:main
