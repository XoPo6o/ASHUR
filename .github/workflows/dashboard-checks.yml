name: ASHUR dashboard checks

on:
  push:
    branches:
      - ashur-pixel-terminal-ui
    paths:
      - "dashboard/**"
      - "tests/test_dashboard_*.py"
      - "wall-preview.html"
      - "trading-lab/ashur_supervisor.py"
      - ".github/workflows/dashboard-checks.yml"
  pull_request:
    branches:
      - ashur-live-shadow
    paths:
      - "dashboard/**"
      - "tests/test_dashboard_*.py"
      - "wall-preview.html"
      - "trading-lab/ashur_supervisor.py"
      - ".github/workflows/dashboard-checks.yml"

permissions:
  contents: read

jobs:
  dashboard-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dashboard unit tests
        run: python -m unittest discover -s tests -p "test_dashboard_*.py" -v
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("wall-preview.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one dashboard script, found {len(scripts)}")
          Path("/tmp/ashur-dashboard.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/ashur-dashboard.js
