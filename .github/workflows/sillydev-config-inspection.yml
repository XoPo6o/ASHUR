name: SillyDev server config inspection

on:
  push:
    branches: [ashur-live-shadow]
    paths:
      - ".github/workflows/sillydev-config-inspection.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read current Git and startup configuration
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
        run: |
          set -euo pipefail
          for endpoint in git git/config; do
            echo "===== GET $endpoint ====="
            curl --fail-with-body --silent --show-error \
              "https://sillydev.co.uk/panel/api/client/servers/${SILLYDEV_SERVER_ID}/${endpoint}" \
              -H "Authorization: Bearer ${SILLYDEV_API_KEY}" \
              -H "Accept: application/json" | python -m json.tool
          done
