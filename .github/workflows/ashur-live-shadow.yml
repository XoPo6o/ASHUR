name: ASHUR Live Shadow Paper Lab
run-name: ASHUR · 5 parallel live-data paper strategies

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ashur-live-shadow
  cancel-in-progress: false

jobs:
  shadow-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout isolated shadow ledger
        uses: actions/checkout@v4
        with:
          ref: ashur-live-shadow
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Run five independent paper strategies on live Bybit market data
        env:
          PYTHONUNBUFFERED: "1"
        run: python trading-lab/live_shadow_worker.py
      - name: Persist isolated paper ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f trading-lab/ashur_shadow.db
          if git diff --cached --quiet; then
            echo "No ledger changes."
            exit 0
          fi
          git commit -m "Update ASHUR live shadow paper ledger"
          git pull --rebase origin ashur-live-shadow
          git push origin HEAD:ashur-live-shadow
      - name: Upload ledger snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashur-live-shadow-ledger
          path: trading-lab/ashur_shadow.db
          if-no-files-found: warn
          retention-days: 30
