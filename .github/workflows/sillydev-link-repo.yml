name: Link ASHUR to Silly Development

on:
  push:
    branches: [ashur-live-shadow]
    paths:
      - ".github/workflows/sillydev-link-repo.yml"

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Link public ASHUR repository and verify
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
        run: |
          set -euo pipefail
          test -n "$SILLYDEV_API_KEY"
          test -n "$SILLYDEV_SERVER_ID"

          echo "===== PREFLIGHT ====="
          curl --fail-with-body --silent --show-error \
            "https://sillydev.co.uk/panel/api/client/servers/${SILLYDEV_SERVER_ID}/git" \
            -H "Authorization: Bearer ${SILLYDEV_API_KEY}" \
            -H "Accept: application/json" | python -c '
          import json,sys
          d=json.load(sys.stdin)
          print("can_manage=", d.get("can_manage"))
          print("existing_repository=", d.get("repository"))
          assert d.get("can_manage") is True, "API key cannot manage this server"
          assert d.get("repository") is None, "A repository is already linked; refusing to overwrite it"
          '

          cat > /tmp/link.json <<'JSON'
          {
            "source": "url",
            "repository": "https://github.com/XoPo6o/ASHUR.git",
            "branch": "ashur-live-shadow",
            "directory": "/",
            "auto_deploy": false,
            "restart_on_deploy": false,
            "start_if_offline": false,
            "apply_config": true,
            "sync_startup": false,
            "write_config": false
          }
          JSON

          echo "===== LINK REPOSITORY ====="
          curl --fail-with-body --silent --show-error -X PUT \
            "https://sillydev.co.uk/panel/api/client/servers/${SILLYDEV_SERVER_ID}/git" \
            -H "Authorization: Bearer ${SILLYDEV_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/link.json | tee /tmp/link-response.json | python -m json.tool

          echo "===== VERIFY LINK AND FIRST DEPLOYMENT ====="
          sleep 3
          curl --fail-with-body --silent --show-error \
            "https://sillydev.co.uk/panel/api/client/servers/${SILLYDEV_SERVER_ID}/git" \
            -H "Authorization: Bearer ${SILLYDEV_API_KEY}" \
            -H "Accept: application/json" | python -m json.tool
