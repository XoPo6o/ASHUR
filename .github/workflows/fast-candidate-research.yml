name: ASHUR cross-asset 15m and 1h candidate research

on:
  push:
    branches:
      - ashur-signal-observability
    paths:
      - "trading-lab/research_fast_candidates.py"
      - "trading-lab/research_live_six.py"
      - "trading-lab/strategy_lab_v3.py"
      - ".github/workflows/fast-candidate-research.yml"

permissions:
  contents: read

concurrency:
  group: ashur-fast-candidate-research-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  candidate-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install "numpy<3" "pandas<3"
      - name: Compile candidate research modules
        working-directory: trading-lab
        run: python -m py_compile research_fast_candidates.py research_live_six.py strategy_lab_v3.py live_shadow_worker.py
      - name: Run cross-asset 15m and 1h candidate OOS research
        working-directory: trading-lab
        run: python research_fast_candidates.py
      - name: Upload candidate research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashur-cross-asset-candidate-research
          path: |
            trading-lab/research-output/cross_asset_candidate_research.json
            trading-lab/research-output/cross_asset_candidate_research.csv
          if-no-files-found: warn
          retention-days: 30
