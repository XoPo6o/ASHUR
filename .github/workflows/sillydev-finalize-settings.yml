name: Finalize ASHUR deployment behavior

on:
  push:
    branches: [ashur-live-shadow]
    paths:
      - ".github/workflows/sillydev-finalize-settings.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Enable restart and start after future Git deployments
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X PUT \
            "https://sillydev.co.uk/panel/api/client/servers/${SILLYDEV_SERVER_ID}/git" \
            -H "Authorization: Bearer ${SILLYDEV_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data-binary '{
              "source": "url",
              "repository": "https://github.com/XoPo6o/ASHUR.git",
              "branch": "ashur-live-shadow",
              "directory": "/",
              "auto_deploy": false,
              "restart_on_deploy": true,
              "start_if_offline": true,
              "apply_config": true,
              "sync_startup": false,
              "write_config": false
            }' | python -m json.tool
