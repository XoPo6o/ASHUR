name: Freqtrade Bybit evaluation

on:
  push:
    branches: [freqtrade-evaluation]
    paths:
      - "freqtrade-lab/**"
      - ".github/workflows/freqtrade-evaluation.yml"
  pull_request:
    branches: [ashur-live-shadow]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freqtrade-evaluation

      - name: Pull pinned official Freqtrade image
        run: docker pull freqtradeorg/freqtrade:2026.10

      - name: Verify Freqtrade version and strategy discovery
        working-directory: freqtrade-lab
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:2026.10 --version
          docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:2026.10 list-strategies --userdir user_data --strategy-path user_data/strategies

      - name: Validate all dry-run configurations
        working-directory: freqtrade-lab
        run: |
          set -euo pipefail
          for config in user_data/config-*.json; do
            echo "Validating $config"
            docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:2026.10 show-config --config "$config" >/dev/null
          done

      - name: Download Bybit Spot OHLCV history
        working-directory: freqtrade-lab
        run: |
          set -euo pipefail
          FT="docker run --rm -v $PWD/user_data:/freqtrade/user_data freqtradeorg/freqtrade:2026.10"
          $FT download-data --config user_data/config-bnb-15m.json --timeframes 5m 15m 1h --days 730
          $FT download-data --config user_data/config-bnb-4h.json --timeframes 4h 1d --days 1095
          $FT download-data --config user_data/config-sol-4h.json --timeframes 15m 4h --days 1095

      - name: Run chronological in-sample and out-of-sample backtests
        working-directory: freqtrade-lab
        run: |
          set -euo pipefail
          mkdir -p user_data/backtest_results
          run_bt() {
            local config="$1" strategy="$2" detail="$3" period="$4"
            echo "BACKTEST strategy=$strategy period=$period detail=$detail"
            docker run --rm -v "$PWD/user_data:/freqtrade/user_data" freqtradeorg/freqtrade:2026.10               backtesting --userdir user_data --config "$config" --strategy-path user_data/strategies               --strategy "$strategy" --timerange "$period" --fee 0.0015               --timeframe-detail "$detail" --enable-protections --export trades
          }
          for period in 20241121-20251121 20251121-20261121; do
            run_bt user_data/config-bnb-15m.json BNB_15M_EMA_TREND 5m "$period"
            run_bt user_data/config-bnb-1h.json BNB_1H_DONCHIAN_ADX25 15m "$period"
            run_bt user_data/config-bnb-4h.json BNB_4H_ADX_TREND 15m "$period"
            run_bt user_data/config-bnb-4h.json BNB_4H_KELTNER_ADX 15m "$period"
            run_bt user_data/config-sol-4h.json SOL_4H_DONCHIAN_VOL 15m "$period"
            run_bt user_data/config-bnb-1d.json BNB_1D_DONCHIAN55 1h "$period"
          done

      - name: Check lookahead and recursive indicator stability
        working-directory: freqtrade-lab
        run: |
          set -euo pipefail
          FT="docker run --rm -v $PWD/user_data:/freqtrade/user_data freqtradeorg/freqtrade:2026.10"
          $FT lookahead-analysis --userdir user_data --config user_data/config-bnb-15m.json --strategy-path user_data/strategies --strategy BNB_15M_EMA_TREND --timerange 20241121-20261121
          $FT lookahead-analysis --userdir user_data --config user_data/config-bnb-1h.json --strategy-path user_data/strategies --strategy BNB_1H_DONCHIAN_ADX25 --timerange 20241121-20261121
          $FT recursive-analysis --userdir user_data --config user_data/config-bnb-4h.json --strategy-path user_data/strategies --strategy BNB_4H_ADX_TREND --timerange 20241121-20261121
          $FT recursive-analysis --userdir user_data --config user_data/config-bnb-1d.json --strategy-path user_data/strategies --strategy BNB_1D_DONCHIAN55 --timerange 20241121-20261121

      - name: Build machine-readable summary
        if: always()
        working-directory: freqtrade-lab
        run: python3 summarize.py | tee user_data/backtest_results/summary.json

      - name: Upload raw data, backtests, summary and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freqtrade-bybit-evaluation
          path: |
            freqtrade-lab/user_data/data/
            freqtrade-lab/user_data/backtest_results/
            freqtrade-lab/user_data/logs/
          if-no-files-found: warn
          retention-days: 30
