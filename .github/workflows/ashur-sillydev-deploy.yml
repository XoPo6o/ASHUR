name: ASHUR checks and Silly Development deploy

on:
  push:
    branches: [ashur-live-shadow]
    paths:
      - "ashur_sillydev_start.py"
      - "trading-lab/**"
      - "requirements.txt"
      - "sillydev.conf"
      - ".github/workflows/ashur-sillydev-deploy.yml"
      - ".github/workflows/ashur-sillydev-deploy-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ashur-live-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ASHUR paper branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ASHUR dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile launcher, daemon, worker and news collector
        run: python -m py_compile ashur_sillydev_start.py trading-lab/ashur_daemon.py trading-lab/live_shadow_worker.py trading-lab/news_intelligence.py
      - name: Run offline regression tests
        run: |
          python trading-lab/test_ashur_daemon.py
          python trading-lab/test_news_intelligence.py

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy tested ASHUR branch to Silly Development
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          CURRENT_SHA="$(git ls-remote https://github.com/XoPo6o/ASHUR.git refs/heads/ashur-live-shadow | awk '{print $1}')"
          if [ "$CURRENT_SHA" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Refusing stale deployment. Branch HEAD is $CURRENT_SHA; tested commit is $EXPECTED_COMMIT."
            exit 1
          fi
          if [ -z "$SILLYDEV_API_KEY" ] || [ -z "$SILLYDEV_SERVER_ID" ]; then
            echo "Deploy skipped: configure SILLYDEV_API_KEY and SILLYDEV_SERVER_ID in GitHub first."
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST \
            "https://sillydev.co.uk/panel/api/client/servers/${SILLYDEV_SERVER_ID}/git/deploy" \
            -H "Authorization: Bearer ${SILLYDEV_API_KEY}" \
            -H "Accept: application/json"
