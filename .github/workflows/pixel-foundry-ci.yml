name: Pixel Foundry CI

on:
  push:
    branches: [ashur-pixel-foundry]
    paths:
      - "pixel_foundry/**"
      - ".github/workflows/pixel-foundry-ci.yml"
  pull_request:
    paths:
      - "pixel_foundry/**"
      - ".github/workflows/pixel-foundry-ci.yml"

permissions:
  contents: write

jobs:
  test-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow pytest
      - run: python -m pytest pixel_foundry/tests -q
      - run: python -m pixel_foundry.cli render pixel_foundry/examples/babylon_study.json --output /tmp/babylon.png --scale 3
      - run: python -m pixel_foundry.cli render pixel_foundry/examples/babylon_art_bible.json --output /tmp/babylon-art-bible.png --scale 3
      - run: python -m pixel_foundry.cli inspect /tmp/babylon-art-bible.png
      - run: python -m pixel_foundry.cli render pixel_foundry/examples/traveler_poses.json --output /tmp/traveler-poses.png --scale 3
      - run: python -m pixel_foundry.cli ui-kit pixel_foundry/palettes/babylon_inventory_v2.json --output /tmp/babylon-ui-kit
      - run: python -m pixel_foundry.cli widgets pixel_foundry/palettes/babylon_inventory_v2.json --output /tmp/babylon-widgets
      - run: python -m pixel_foundry.cli controls pixel_foundry/palettes/babylon_inventory_v2.json --output /tmp/babylon-controls
      - run: python -m pixel_foundry.cli palette-study pixel_foundry/examples/babylon_art_bible.json --output /tmp/babylon-palette-study --scale 4
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-foundry-babylon-study
          path: |
            /tmp/babylon.png
            /tmp/babylon-art-bible.png
            /tmp/traveler-poses.png
            /tmp/babylon-ui-kit/
            /tmp/babylon-widgets/
            /tmp/babylon-controls/
            /tmp/babylon-palette-study/
      - uses: actions/checkout@v4
        with:
          ref: main
          path: pages-site
      - name: Publish generated palette study to Pixel Lab
        run: |
          mkdir -p pages-site/assets/pixel/studies/palette-2026-11-27
          cp /tmp/babylon-palette-study/*.png pages-site/assets/pixel/studies/palette-2026-11-27/
          cd pages-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pixel/studies/palette-2026-11-27
          git diff --cached --quiet || git commit -m "Publish Babylon palette study to Pixel Lab"
          git push origin HEAD:main
