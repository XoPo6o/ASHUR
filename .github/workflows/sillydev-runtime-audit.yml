name: Verify ASHUR runtime cycle and persistent ledger

on:
  push:
    branches: [ashur-live-shadow]
    paths:
      - ".github/workflows/sillydev-runtime-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install read-only audit client
        run: python -m pip install --disable-pip-version-check requests websockets

      - name: Verify deployment, daemon console, status JSON and SQLite
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
          DEPLOYMENT_ID: d0b6aa97-525f-417f-bc01-95879539a211
        run: |
          set -euo pipefail
          sleep 45
          export API="https://sillydev.co.uk/panel/api/client"
          curl --fail-with-body --silent --show-error "$API/servers/$SILLYDEV_SERVER_ID/git" \
            -H "Authorization: Bearer $SILLYDEV_API_KEY" -H "Accept: application/json" > /tmp/git.json
          python - <<'PY'
          import json, os
          d=json.load(open("/tmp/git.json"))
          target=next((x for x in d.get("deployments",[]) if x.get("uuid")==os.environ["DEPLOYMENT_ID"]),None)
          print("DEPLOYMENT_AUDIT=",json.dumps(target,sort_keys=True))
          if not target or target.get("status") != "succeeded":
              raise SystemExit("Expected deployment has not succeeded")
          PY

          curl --fail-with-body --silent --show-error "$API/servers/$SILLYDEV_SERVER_ID/resources" \
            -H "Authorization: Bearer $SILLYDEV_API_KEY" -H "Accept: application/json" > /tmp/resources.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/resources.json"))["attributes"]
          print("SERVER_STATE=",d.get("current_state"))
          print("RESOURCES=",json.dumps(d.get("resources",{}),sort_keys=True))
          if d.get("current_state") != "running":
              raise SystemExit("Server is not running")
          PY

          python - <<'PY'
          import asyncio, json, os, requests, websockets
          api=os.environ["API"]; server=os.environ["SILLYDEV_SERVER_ID"]
          headers={"Authorization":"Bearer "+os.environ["SILLYDEV_API_KEY"],"Accept":"application/json"}
          async def main():
              r=requests.get(f"{api}/servers/{server}/websocket",headers=headers,timeout=15)
              r.raise_for_status()
              data=r.json()["data"]
              lines=[]
              async with websockets.connect(data["socket"],origin="https://sillydev.co.uk") as ws:
                  await ws.send(json.dumps({"event":"auth","args":[data["token"]]}))
                  deadline=asyncio.get_running_loop().time()+40
                  authed=False
                  while asyncio.get_running_loop().time()<deadline:
                      try:
                          raw=await asyncio.wait_for(ws.recv(),timeout=5)
                      except asyncio.TimeoutError:
                          continue
                      msg=json.loads(raw); event=msg.get("event"); args=msg.get("args") or []
                      if event=="auth success" and not authed:
                          authed=True
                          await ws.send(json.dumps({"event":"send logs"}))
                      elif event=="console output" and args:
                          line=str(args[0])
                          lines.append(line)
                          print("BOT_LOG:",line)
                      elif event=="status" and args:
                          print("CONSOLE_STATUS:",args[0])
              joined="\n".join(lines)
              required=("ASHUR paper daemon started","WORKER_CYCLE_START","WORKER_CYCLE_END")
              for marker in required:
                  print("MARKER",marker,"FOUND",marker in joined)
              if "ASHUR paper daemon started" not in joined:
                  raise SystemExit("ASHUR daemon startup line not found in console history")
              if "WORKER_CYCLE_END exit_code=0" not in joined:
                  raise SystemExit("No successful worker cycle found in console history")
          asyncio.run(main())
          PY

          echo "===== STATUS JSON ====="
          status_code=$(curl --silent --show-error --output /tmp/status.json --write-out "%{http_code}" --get \
            --data-urlencode "file=/.local/share/ashur/ashur_shadow_status.json" \
            "$API/servers/$SILLYDEV_SERVER_ID/files/contents" \
            -H "Authorization: Bearer $SILLYDEV_API_KEY" -H "Accept: application/json")
          echo "STATUS_FILE_HTTP=$status_code"
          if [ "$status_code" = "200" ]; then
            python - <<'PY'
          import json
          d=json.load(open("/tmp/status.json"))
          print("STATUS_MODE=",d.get("mode"))
          print("STATUS_UPDATED_AT=",d.get("updated_at"))
          print("STRATEGIES=",len(d.get("accounts",[])))
          for a in d.get("accounts",[]):
              print("ACCOUNT=",a.get("strategy_id"),"trades=",a.get("trades"),"cash=",a.get("cash"),"pnl=",a.get("net_pnl"),"price=",a.get("last_price"))
          if d.get("mode")!="PAPER_ONLY" or len(d.get("accounts",[]))!=6:
              raise SystemExit("Unexpected paper status format or strategy count")
          PY
          else
            cat /tmp/status.json
            exit 1
          fi

          echo "===== SQLITE LEDGER ====="
          curl --fail-with-body --silent --show-error --get --data-urlencode "file=/.local/share/ashur/ashur_shadow.db" \
            "$API/servers/$SILLYDEV_SERVER_ID/files/download" \
            -H "Authorization: Bearer $SILLYDEV_API_KEY" -H "Accept: application/json" > /tmp/download.json
          signed_url=$(python -c 'import json; print(json.load(open("/tmp/download.json"))["attributes"]["url"])')
          curl --fail --silent --show-error "$signed_url" -o /tmp/ashur_shadow.db
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect("/tmp/ashur_shadow.db")
          for table in ("shadow_accounts","shadow_positions","shadow_trades","shadow_state","shadow_events","shadow_marks","shadow_trade_guard"):
              count=db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
              print("SQLITE_TABLE",table,"ROWS",count)
          print("ALL_TRADES")
          for row in db.execute("SELECT id,strategy_id,symbol,entry,exit,qty,fees,pnl,reason,opened_at,closed_at FROM shadow_trades ORDER BY id"):
              print(*row,sep=" | ")
          print("BNB_15M_TRADE_EVENTS")
          for row in db.execute("SELECT created_at,event,details FROM shadow_events WHERE strategy_id='BNB_15M_EMA_TREND' AND event IN ('OPEN','CLOSE','ERROR') ORDER BY id"):
              print(*row,sep=" | ")
          print("RECENT_EVENTS")
          for row in db.execute("SELECT created_at,strategy_id,event,details FROM shadow_events ORDER BY id DESC LIMIT 12"):
              print(*row,sep=" | ")
          PY
