name: ASHUR Live Shadow Strategy Research
run-name: ASHUR live-shadow · six-strategy 3y validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/ashur_live_strategy_research.py"
      - ".github/workflows/ashur-live-strategy-research.yml"

permissions:
  contents: read

concurrency:
  group: ashur-live-shadow-strategy-research
  cancel-in-progress: false

jobs:
  research:
    name: Backtest exact six live-shadow strategies
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research runner
        uses: actions/checkout@v4
      - name: Checkout current live-shadow strategy code
        uses: actions/checkout@v4
        with:
          ref: ashur-live-shadow
          path: live-code
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Run exact live-shadow strategy validation
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python research/ashur_live_strategy_research.py \
            --live-code-dir live-code/trading-lab \
            --output-dir research-results
      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashur-live-shadow-six-strategy-research
          path: |
            research-results/ashur_live_strategy_research.json
            research-results/ashur_live_strategy_research.csv
          if-no-files-found: warn
          retention-days: 30
