name: ASHUR Strategy Research v4.1
run-name: ASHUR research v4.1 · Keltner ADX robustness · quality-gated validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ashur-strategy-research-v4.yml"
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ashur-strategy-research-v4
  cancel-in-progress: false

jobs:
  research:
    name: Keltner ADX parameter robustness and held-out test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ASHUR research code
        uses: actions/checkout@v4
        with:
          ref: mvp-paper-trading
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependency
        run: python -m pip install --disable-pip-version-check pandas
      # Triggered by the audited research-plan update; only candidates with positive validation return, PF > 1, and at least 12 validation trades reach the held-out test.
      - name: Run validation-led strategy research v4
        env:
          PYTHONUNBUFFERED: "1"
        run: python trading-lab/strategy_lab_v4.py
      - name: Upload detailed v4 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashur-strategy-research-v4
          path: |
            trading-lab/strategy_research_v4.json
            trading-lab/strategy_research_v4.csv
          if-no-files-found: warn
          retention-days: 30
