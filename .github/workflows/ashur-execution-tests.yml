name: ASHUR realistic execution tests

on:
  push:
    branches: [ashur-realistic-execution]
    paths:
      - "trading-lab/**"
      - ".github/workflows/ashur-execution-tests.yml"

permissions:
  contents: read

jobs:
  execution-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Unit tests
        working-directory: trading-lab
        run: python -m unittest discover -s tests -v
      - name: Compile research scripts
        working-directory: trading-lab
        run: python -m py_compile execution_model.py strategy_lab_v3.py strategy_lab_v4.py
