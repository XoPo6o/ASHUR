name: ASHUR paper statistics report
run-name: ASHUR paper report · ${{ github.event_name }} · fresh snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ashur-paper-statistics.yml"
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ashur-paper-statistics
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect server status, quotes and paper ledger
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://sillydev.co.uk/panel/api/client"
          AUTH=(-H "Authorization: Bearer $SILLYDEV_API_KEY" -H "Accept: application/json")
          curl --fail-with-body --silent --show-error --get --data-urlencode "file=/.local/share/ashur/ashur_shadow_status.json" "$API/servers/$SILLYDEV_SERVER_ID/files/contents" "${AUTH[@]}" > /tmp/status.json
          curl --fail-with-body --silent --show-error "$API/servers/$SILLYDEV_SERVER_ID/resources" "${AUTH[@]}" > /tmp/resources.json
          curl --fail-with-body --silent --show-error --get --data-urlencode "file=/.local/share/ashur/ashur_shadow.db" "$API/servers/$SILLYDEV_SERVER_ID/files/download" "${AUTH[@]}" > /tmp/download.json
          signed_url=$(python -c 'import json; print(json.load(open("/tmp/download.json"))["attributes"]["url"])')
          curl --fail --silent --show-error "$signed_url" -o /tmp/ashur.db
          python - <<'PY' | tee /tmp/ashur-report.md
          import json, sqlite3
          from datetime import datetime, timezone, timedelta

          def age_seconds(value):
              if not value:
                  return None
              return int((datetime.now(timezone.utc) - datetime.fromisoformat(value.replace("Z", "+00:00"))).total_seconds())

          s=json.load(open("/tmp/status.json"))
          r=json.load(open("/tmp/resources.json"))["attributes"]
          c=sqlite3.connect("/tmp/ashur.db")
          c.row_factory=sqlite3.Row
          print("# ASHUR paper trading report")
          print()
          print("Generated UTC:",datetime.now(timezone.utc).isoformat())
          print("Server:",r.get("current_state"),"| memory bytes:",r.get("resources",{}).get("memory_bytes"))
          status_age=age_seconds(s.get("updated_at"))
          print("Mode:",s.get("mode"),"| status updated:",s.get("updated_at"),"| age seconds:",status_age)
          health=s.get("worker_health",{})
          print("Worker health:",health)
          print()

          integrity=c.execute("PRAGMA integrity_check").fetchone()[0]
          print("SQLite integrity:",integrity)
          required={"shadow_accounts","shadow_positions","shadow_trades","shadow_events","shadow_marks",
                    "news_items","news_collection_runs","news_veto_outcomes"}
          present={x[0] for x in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing=sorted(required-present)
          if missing:
              raise SystemExit("Missing required SQLite tables: "+", ".join(missing))

          latest_mark=c.execute("SELECT MAX(updated_at) FROM shadow_marks").fetchone()[0]
          mark_age=age_seconds(latest_mark)
          print("Latest market mark:",latest_mark,"| age seconds:",mark_age)
          print()

          print("| Strategy | Grade | Last price | Trades | Realized PnL | Unrealized PnL | Equity | Return |")
          print("|---|---|---:|---:|---:|---:|---:|---:|")
          for a in s.get("accounts",[]):
              print(f'| {a["strategy_id"]} | {a["grade"]} | {a["last_price"]} | {a["trades"]} | {a["realized_pnl"]:.4f} | {a["unrealized_pnl"]:.4f} | {a["equity"]:.4f} | {a["return_pct"]:.4f}% |')
          print()
          for t in ("shadow_accounts","shadow_positions","shadow_trades","shadow_events","shadow_marks"):
              print(f'{t}: {c.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]}')

          cutoff=(datetime.now(timezone.utc)-timedelta(hours=24)).isoformat()
          news_run=c.execute("""SELECT COUNT(*),COALESCE(SUM(fetched_count),0),
              COALESCE(SUM(inserted_count),0),COALESCE(SUM(error_count),0)
              FROM news_collection_runs WHERE started_at>=?""",(cutoff,)).fetchone()
          last_news=c.execute("SELECT MAX(finished_at) FROM news_collection_runs").fetchone()[0]
          news_age=age_seconds(last_news)
          news_items=c.execute("""SELECT COUNT(*),COUNT(DISTINCT url),COALESCE(SUM(high_risk),0)
              FROM news_items WHERE fetched_at>=?""",(cutoff,)).fetchone()
          veto=c.execute("""SELECT COUNT(*),COUNT(return_1h),COUNT(return_4h),COUNT(return_24h),
              AVG(return_1h),AVG(return_4h),AVG(return_24h),
              SUM(return_1h<0),SUM(return_1h>0),SUM(return_4h<0),SUM(return_4h>0),
              SUM(return_24h<0),SUM(return_24h>0)
              FROM news_veto_outcomes""").fetchone()
          print()
          print("## News Intelligence — last 24 hours")
          print("Collector runs:",news_run[0],"| fetched:",news_run[1],"| inserted:",news_run[2],
                "| feed errors:",news_run[3])
          # Decode persisted per-symbol errors so transient RSS failures are actionable.
          error_counts={}
          error_samples=[]
          for raw_errors, in c.execute("""SELECT errors_json FROM news_collection_runs
              WHERE started_at>=? AND error_count>0 ORDER BY started_at DESC""",(cutoff,)):
              try:
                  for message in json.loads(raw_errors):
                      symbol=message.split(":",1)[0]
                      error_counts[symbol]=error_counts.get(symbol,0)+1
                      if len(error_samples)<8:
                          error_samples.append(message[:240])
              except (TypeError,ValueError):
                  error_counts["unparsed"]=error_counts.get("unparsed",0)+1
          print("Feed errors by symbol:",error_counts)
          print("Recent feed error samples:",error_samples)
          print("Last collector finish:",last_news,"| age seconds:",news_age)
          print("Stored headlines:",news_items[0],"| unique URLs:",news_items[1],"| high-risk:",news_items[2])
          print("Tracked vetoes:",veto[0],"| measured 1h/4h/24h:",veto[1],veto[2],veto[3])
          if veto[0] < 30:
              print("WARNING: NEWS_VETO sample is too small for strategy conclusions (target >=30).")
          print("Average net return after veto at 1h/4h/24h (%):",
                *[round((float(veto[i] or 0))*100,4) for i in (4,5,6)])
          print("Avoided losses 1h/4h/24h:",*[int(veto[i] or 0) for i in (7,9,11)])
          print("Missed gains 1h/4h/24h:",*[int(veto[i] or 0) for i in (8,10,12)])
          print()
          print("## Runtime execution diagnostics — last 7 days")
          diagnostic_cutoff=(datetime.now(timezone.utc)-timedelta(days=7)).isoformat()
          diagnostic_events=c.execute("""SELECT created_at,strategy_id,event,details FROM shadow_events
              WHERE created_at>=? AND event IN
              ('OPEN','CLOSE','ERROR','INTRABAR_DATA_WARNING','INTRABAR_GAP_RESET','INTRABAR_EXIT','NEWS_VETO')
              ORDER BY id DESC LIMIT 120""",(diagnostic_cutoff,)).fetchall()
          if not diagnostic_events:
              print("No execution or warning events in the last 7 days.")
          for event_row in diagnostic_events:
              print("-"," | ".join(str(value) for value in event_row))
          if "shadow_intrabar_health" in present:
              print()
              print("Intrabar protection health:")
              for health_row in c.execute("""SELECT strategy_id,last_success_at,last_error,last_error_at
                  FROM shadow_intrabar_health ORDER BY strategy_id"""):
                  print("-"," | ".join(str(value) if value is not None else "none" for value in health_row))
          print()
                    print("## Closed paper trades")
          rows=c.execute("SELECT strategy_id,symbol,entry,exit,qty,fees,pnl,reason,opened_at,closed_at FROM shadow_trades ORDER BY id").fetchall()
          if not rows: print("No closed trades yet.")
          for x in rows: print("-"," | ".join(map(str,x)))
          print()
          print("## Open paper positions")
          rows=c.execute("SELECT strategy_id,symbol,qty,entry,stop,target,opened_at FROM shadow_positions").fetchall()
          if not rows: print("No open positions.")
          for x in rows: print("-"," | ".join(map(str,x)))

          if integrity!="ok": raise SystemExit("SQLite integrity check failed")
          if s.get("mode")!="PAPER_ONLY": raise SystemExit("Unexpected trading mode; refusing report")
          if len(s.get("accounts",[]))!=6: raise SystemExit("Unexpected strategy count")
          if not health.get("all_strategies_ok",False):
              raise SystemExit("Worker health degraded or missing; report is not considered healthy")
          if r.get("current_state")!="running": raise SystemExit("SillyDev server is not running")
          if status_age is None or status_age>900: raise SystemExit("ASHUR heartbeat stale")
          if mark_age is None or mark_age>900: raise SystemExit("SQLite market marks stale")
          if news_age is None or news_age>900: raise SystemExit("News collector heartbeat stale")
          PY
      - name: Publish report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashur-paper-report-${{ github.run_id }}
          path: /tmp/ashur-report.md
          retention-days: 30
      - name: Add report to workflow summary
        run: cat /tmp/ashur-report.md >> "$GITHUB_STEP_SUMMARY"
