name: ASHUR current paper snapshot
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ashur-paper-snapshot.yml"
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read live ASHUR status and paper ledger
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
        run: |
          set -euo pipefail
          API="https://sillydev.co.uk/panel/api/client"
          AUTH=(-H "Authorization: Bearer $SILLYDEV_API_KEY" -H "Accept: application/json")
          curl --fail-with-body --silent --show-error --get --data-urlencode "file=/.local/share/ashur/ashur_shadow_status.json" "$API/servers/$SILLYDEV_SERVER_ID/files/contents" "${AUTH[@]}" > /tmp/status.json
          echo "===== PAPER STATUS ====="
          python - <<'PY'
          import json
          d=json.load(open("/tmp/status.json"))
          print("UPDATED_AT",d.get("updated_at"))
          print("MODE",d.get("mode"))
          for a in d.get("accounts",[]):
              print("ACCOUNT",a["strategy_id"],"grade",a["grade"],"price",a["last_price"],"price_at",a["last_price_at"],"trades",a["trades"],"wins",a["wins"],"realized",a["realized_pnl"],"unrealized",a["unrealized_pnl"],"equity",a["equity"],"return_pct",a["return_pct"],"position",a["position"])
          PY
          echo "===== SERVER RESOURCES ====="
          curl --fail-with-body --silent --show-error "$API/servers/$SILLYDEV_SERVER_ID/resources" "${AUTH[@]}" > /tmp/resources.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/resources.json"))["attributes"]
          print("STATE",d.get("current_state"),"BOOTING",d.get("is_booting"),"RESOURCES",d.get("resources"))
          PY
          echo "===== SQLITE COUNTS ====="
          curl --fail-with-body --silent --show-error --get --data-urlencode "file=/.local/share/ashur/ashur_shadow.db" "$API/servers/$SILLYDEV_SERVER_ID/files/download" "${AUTH[@]}" > /tmp/download.json
          signed_url=$(python -c 'import json; print(json.load(open("/tmp/download.json"))["attributes"]["url"])')
          curl --fail --silent --show-error "$signed_url" -o /tmp/ashur.db
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect("/tmp/ashur.db")
          for t in ("shadow_accounts","shadow_positions","shadow_trades","shadow_events","shadow_marks"):
              print("TABLE",t,"ROWS",c.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0])
          print("TRADES")
          for r in c.execute("SELECT strategy_id,symbol,entry,exit,qty,fees,pnl,reason,opened_at,closed_at FROM shadow_trades ORDER BY id"):
              print("TRADE",*r)
          print("OPEN_POSITIONS")
          for r in c.execute("SELECT strategy_id,symbol,qty,entry,stop,target,opened_at FROM shadow_positions"):
              print("POSITION",*r)
          PY
