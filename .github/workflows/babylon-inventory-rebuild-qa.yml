name: Babylon Inventory Rebuild QA
on:
  push:
    branches: [wall-rebuild-babylon]
    paths:
      - 'wall-variants/01-babylon-inventory-v2.html'
      - '.github/workflows/babylon-inventory-rebuild-qa.yml'
      - 'wall-data.json'
      - 'wall-history.json'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: babylon-inventory-rebuild-qa
  cancel-in-progress: true
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ashur-preview.log 2>&1 &
          echo $! >/tmp/ashur-preview.pid
      - name: Capture and verify desktop, reference viewport, mobile
        run: |
          mkdir -p qa
          cat > qa/run.cjs <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[
              ['desktop',{width:1440,height:1000},false],
              ['reference',{width:768,height:555},false],
              ['mobile',{width:390,height:844},true]
            ];
            const results=[];
            for(const [name,viewport,mobile] of cases){
              const context=await browser.newContext({viewport,isMobile:mobile,hasTouch:mobile,deviceScaleFactor:1});
              const page=await context.newPage(),errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              const response=await page.goto('http://127.0.0.1:8765/wall-variants/01-babylon-inventory-v2.html',{waitUntil:'networkidle',timeout:30000});
              await page.waitForFunction(()=>document.querySelector('#equity')?.textContent!=='—' && /ALL SYSTEMS OK/.test(document.querySelector('#health')?.textContent||''),{timeout:15000}).catch(()=>{});
              await page.screenshot({path:'qa/'+name+'.png',fullPage:true,animations:'disabled'});
              const diagnostics=await page.evaluate(()=>{
                const scene=document.querySelector('#babylon'),chart=document.querySelector('#chart');
                const pixels=canvas=>{if(!canvas)return 0;const c=canvas.getContext('2d');if(!c)return 0;const d=c.getImageData(0,0,canvas.width,canvas.height).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i])n++;return n};
                return {
                  title:document.title,
                  equity:document.querySelector('#equity')?.textContent,
                  pnl:document.querySelector('#pnl')?.textContent,
                  relicCount:document.querySelectorAll('.relic').length,
                  tradeRows:document.querySelectorAll('#trade-rows tr').length,
                  sceneCanvas:scene?.width+'x'+scene?.height,
                  scenePixels:pixels(scene),
                  chartCanvas:chart?.width+'x'+chart?.height,
                  chartPixels:pixels(chart),
                  horizontalOverflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
                  bodyHeight:document.documentElement.scrollHeight,
                  health:document.querySelector('#health')?.textContent,
                  footer:document.querySelector('#footer-state')?.textContent
                };
              });
              results.push({name,status:response?.status(),errors,...diagnostics});
              await context.close();
            }
            fs.writeFileSync('qa/results.json',JSON.stringify(results,null,2));
            await browser.close();
            if(results.some(r=>r.status!==200||r.errors.length||r.relicCount!==6||r.horizontalOverflow>2||r.sceneCanvas!=='768x554'||r.scenePixels<10000||r.chartCanvas!=='640x190'||r.chartPixels<10000||!r.equity||r.equity==='—'||!/ALL SYSTEMS OK/.test(r.health||'')))process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node qa/run.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babylon-inventory-rebuild-qa
          path: qa/
          if-no-files-found: warn
          retention-days: 14
