name: Babylon Inventory Rebuild QA
on:
  push:
    branches: [wall-rebuild-babylon]
    paths:
      - 'wall-variants/01-babylon-inventory-v2.html'
      - '.github/workflows/babylon-inventory-rebuild-qa.yml'
      - 'wall-data.json'
      - 'wall-history.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: babylon-inventory-rebuild-qa
  cancel-in-progress: true
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ashur-preview.log 2>&1 &
          echo $! >/tmp/ashur-preview.pid
      - name: Capture and verify desktop, reference viewport, mobile
        run: |
          mkdir -p qa
          cat > qa/run.cjs <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[
              ['desktop',{width:1440,height:1000},false],
              ['reference',{width:768,height:555},false],
              ['mobile',{width:390,height:844},true]
            ];
            const results=[];
            for(const [name,viewport,mobile] of cases){
              const context=await browser.newContext({viewport,isMobile:mobile,hasTouch:mobile,deviceScaleFactor:1});
              const page=await context.newPage(),errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              const response=await page.goto('http://127.0.0.1:8765/wall-variants/01-babylon-inventory-v2.html',{waitUntil:'networkidle',timeout:30000});
              await page.waitForFunction(()=>document.querySelectorAll('#strategy-grid .strategy').length===6 && document.querySelector('#equity')?.textContent!=='—',{timeout:15000}).catch(()=>{});
              await page.screenshot({path:\`qa/\${name}.png\`,fullPage:true,animations:'disabled'});
              const diagnostics=await page.evaluate(()=>({
                title:document.title,
                equity:document.querySelector('#equity')?.textContent,
                pnl:document.querySelector('#pnl')?.textContent,
                strategyCount:document.querySelectorAll('#strategy-grid .strategy').length,
                tradeRows:document.querySelectorAll('#trade-rows tr').length,
                chartHasData:document.querySelector('#equity-chart')?.querySelectorAll('polyline').length>0,
                horizontalOverflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
                bodyHeight:document.documentElement.scrollHeight,
                health:document.querySelector('#health')?.textContent
              }));
              results.push({name,status:response?.status(),errors,...diagnostics});
              await context.close();
            }
            fs.writeFileSync('qa/results.json',JSON.stringify(results,null,2));
            await browser.close();
            if(results.some(r=>r.status!==200||r.errors.length||r.strategyCount!==6||r.horizontalOverflow>2||!r.equity||r.equity==='—'||!r.chartHasData||!/ALL SYSTEMS OK/.test(r.health||'')))process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node qa/run.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babylon-inventory-rebuild-qa
          path: qa/
          if-no-files-found: warn
          retention-days: 14
