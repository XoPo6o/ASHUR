name: Enzonic API Deploy

on:
  push:
    branches:
      - ashur-live-shadow
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Find Enzonic project
        id: project
        env:
          ENZONIC_TOKEN: ${{ secrets.ENZONIC_TOKEN }}
          PROJECT_NAME: ASHUR-PAPER-TRADING
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            https://panel.enzonic.com/api/cloud/v1/projects \
            -H "Authorization: Bearer $ENZONIC_TOKEN" \
            -H "Accept: application/json" \
            -o projects.json

          PROJECT_ID="$(jq -r --arg name "$PROJECT_NAME" '
            .. | objects
            | select((.name? == $name) or (.slug? == $name))
            | (.id // .project_id // empty)
          ' projects.json | head -n 1)"

          if [ -z "$PROJECT_ID" ]; then
            echo "Project '$PROJECT_NAME' was not found in the Enzonic projects response."
            echo "Raw projects API response (no credentials):"
            jq . projects.json || cat projects.json
            echo "Detected project-like entries:"
            jq -r '
              .. | objects
              | select((.id? != null) or (.project_id? != null))
              | [
                  (.name // .slug // .project_name // .key // "NO_NAME"),
                  (.id // .project_id // "NO_ID")
                ]
              | @tsv
            ' projects.json || true
            echo "Check that this API token belongs to the Enzonic Deploy account and has Deploy access."
            exit 1
          fi

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Found Enzonic project: $PROJECT_NAME"

      - name: Start production deployment
        id: deploy
        env:
          ENZONIC_TOKEN: ${{ secrets.ENZONIC_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail

          RESPONSE="$(curl --fail-with-body -sS -X POST \
            "https://panel.enzonic.com/api/cloud/v1/projects/$PROJECT_ID/deployments" \
            -H "Authorization: Bearer $ENZONIC_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ref":"ashur-live-shadow"}')"

          echo "$RESPONSE" | jq .
          DEPLOYMENT_ID="$(echo "$RESPONSE" | jq -r '.id // .deployment_id // .deployment.id // empty')"

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Enzonic did not return a deployment ID."
            exit 1
          fi

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          DEPLOYMENT_URL="$(echo "$RESPONSE" | jq -r '.url // .deployment.url // empty')"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Read initial deployment logs
        env:
          ENZONIC_TOKEN: ${{ secrets.ENZONIC_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            "https://panel.enzonic.com/api/cloud/v1/deployments/$DEPLOYMENT_ID/logs?after_seq=0" \
            -H "Authorization: Bearer $ENZONIC_TOKEN" \
            -H "Accept: application/json" | jq .
