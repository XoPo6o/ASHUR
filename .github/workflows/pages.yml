name: Deploy ASHUR site with KI.LAM preview

on:
  push:
    branches: ["game-dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ki-lam-preview"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: ki-lam-preview
      url: ${{ steps.deployment.outputs.page_url }}ki-lam/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout KI.LAM preview from game-dev
        uses: actions/checkout@v4
        with:
          ref: game-dev
          path: preview-source

      - name: Add KI.LAM as a separate preview route
        run: |
          mkdir -p site/ki-lam
          cp preview-source/index.html preview-source/intro.css preview-source/intro.js site/ki-lam/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
