name: ASHUR Paper Trading Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/paper-trading-worker.yml

permissions:
  contents: write

concurrency:
  group: ashur-paper-trading-worker
  cancel-in-progress: false

jobs:
  paper-trading:
    name: Run paper trading cycle
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout trading branch
        uses: actions/checkout@v4
        with:
          ref: mvp-paper-trading
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check ccxt pandas

      - name: Run trading cycle
        env:
          PYTHONUNBUFFERED: "1"
        run: python trading-lab/bot_worker.py

      - name: Persist shared paper ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f trading-lab/ashur_paper.db
          if git diff --cached --quiet; then
            echo "Paper ledger unchanged; no commit required."
          else
            git commit -m "chore: update ASHUR paper trading ledger"
            git push origin HEAD:mvp-paper-trading
          fi
