name: ASHUR SillyDev watchdog
run-name: ASHUR watchdog · server availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ashur-sillydev-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check server and start only when offline
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SILLYDEV_API_KEY" || -z "$SILLYDEV_SERVER_ID" ]]; then
            echo "::error::SILLYDEV_API_KEY or SILLYDEV_SERVER_ID is missing."
            exit 1
          fi

          API="https://sillydev.co.uk/panel/api/client"
          AUTH=(-H "Authorization: Bearer $SILLYDEV_API_KEY" -H "Accept: application/json")

          curl --fail-with-body --silent --show-error \
            "$API/servers/$SILLYDEV_SERVER_ID/resources" \
            "${AUTH[@]}" > /tmp/resources.json

          python - <<'PY'
          import json
          d=json.load(open("/tmp/resources.json"))["attributes"]
          print("SERVER_STATE=",d.get("current_state"))
          print("IS_BOOTING=",d.get("is_booting"))
          print("MEMORY_BYTES=",d.get("resources",{}).get("memory_bytes"))
          PY

          STATE=$(python -c 'import json; print(json.load(open("/tmp/resources.json"))["attributes"].get("current_state","unknown"))')
          BOOTING=$(python -c 'import json; print(str(json.load(open("/tmp/resources.json"))["attributes"].get("is_booting",False)).lower())')

          if [[ "$STATE" == "offline" && "$BOOTING" != "true" ]]; then
            echo "Server is offline. Sending one start signal."
            CODE=$(curl --silent --show-error --output /tmp/power.json --write-out "%{http_code}" \
              -X POST "$API/servers/$SILLYDEV_SERVER_ID/power" \
              "${AUTH[@]}" -H "Content-Type: application/json" \
              --data '{"signal":"start"}')
            echo "POWER_HTTP=$CODE"
            if [[ "$CODE" != "204" && "$CODE" != "200" ]]; then
              cat /tmp/power.json
              exit 1
            fi
            echo "Start signal accepted. Next watchdog run will verify the resulting state."
            exit 0
          fi

          if [[ "$STATE" == "running" ]]; then
            echo "Server is already running. No power action taken."
            CODE=$(curl --silent --show-error --output /tmp/status.json --write-out "%{http_code}" --get \
              --data-urlencode "file=/.local/share/ashur/ashur_shadow_status.json" \
              "$API/servers/$SILLYDEV_SERVER_ID/files/contents" "${AUTH[@]}")
            echo "STATUS_FILE_HTTP=$CODE"
            if [[ "$CODE" != "200" ]]; then
              echo "::warning::Server is running, but ASHUR status file could not be read."
              exit 1
            fi
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          d=json.load(open("/tmp/status.json"))
          stamp=d.get("updated_at")
          print("BOT_MODE=",d.get("mode"))
          print("BOT_UPDATED_AT=",stamp)
          print("STRATEGY_COUNT=",len(d.get("accounts",[])))
          if d.get("mode") != "PAPER_ONLY":
              raise SystemExit("Unexpected bot mode; expected PAPER_ONLY")
          if len(d.get("accounts",[])) != 6:
              raise SystemExit("Unexpected strategy count; expected 6")
          if not stamp:
              raise SystemExit("Bot heartbeat timestamp is missing")
          updated=datetime.fromisoformat(stamp.replace("Z","+00:00"))
          age=(datetime.now(timezone.utc)-updated).total_seconds()
          print("HEARTBEAT_AGE_SECONDS=",int(age))
          if age > 900:
              raise SystemExit("Bot heartbeat is stale (>15 minutes); server left running for investigation")
          PY
            echo "ASHUR heartbeat is fresh. Watchdog check passed."
            exit 0
          fi

          if [[ "$BOOTING" == "true" || "$STATE" == "starting" ]]; then
            echo "Server is already booting. No duplicate start signal sent."
            exit 0
          fi

          echo "::warning::Server state is '$STATE'. Watchdog will not send a power action for an unknown state."
