name: ASHUR SillyDev read-only runtime audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ashur-sillydev-readonly-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect SillyDev configuration without changing it
        env:
          SILLYDEV_API_KEY: ${{ secrets.SILLYDEV_API_KEY }}
          SILLYDEV_SERVER_ID: ${{ vars.SILLYDEV_SERVER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode

          key = os.environ.get("SILLYDEV_API_KEY", "")
          server = os.environ.get("SILLYDEV_SERVER_ID", "")
          if not key or not server:
              print("AUDIT_BLOCKED: SILLYDEV_API_KEY or SILLYDEV_SERVER_ID is not configured in GitHub Actions.")
              raise SystemExit(1)

          base = "https://sillydev.co.uk/panel/api/client"
          headers = {"Authorization": f"Bearer {key}", "Accept": "application/json"}

          def get(path, optional=False):
              request = Request(base + path, headers=headers, method="GET")
              try:
                  with urlopen(request, timeout=20) as response:
                      return json.loads(response.read().decode("utf-8"))
              except HTTPError as exc:
                  if optional and exc.code in (403, 404):
                      return None
                  print(f"AUDIT_API_ERROR endpoint={path} http={exc.code}")
                  raise SystemExit(1)
              except (URLError, TimeoutError, OSError, ValueError) as exc:
                  print(f"AUDIT_API_ERROR endpoint={path} type={type(exc).__name__}")
                  raise SystemExit(1)

          def attrs(value):
              return value.get("attributes", value) if isinstance(value, dict) else {}

          def records(value):
              data = value.get("data", []) if isinstance(value, dict) else []
              return [attrs(item) for item in data if isinstance(item, dict)]

          server_data = get(f"/servers/{server}")
          server_attrs = attrs(server_data)
          resource_data = attrs(get(f"/servers/{server}/resources"))
          startup_data = get(f"/servers/{server}/startup")
          startup_meta = startup_data.get("meta", {})
          git_data = get(f"/servers/{server}/git")
          status_path = "/.local/share/ashur/ashur_shadow_status.json"
          worker_status = get(f"/servers/{server}/files/contents?{urlencode({'file': status_path})}", optional=True)
          backup_data = get(f"/servers/{server}/backups", optional=True)

          relationships = server_attrs.get("relationships", {})
          allocation_data = relationships.get("allocations", {}).get("data", [])
          ports = [
              item.get("attributes", {}).get("port")
              for item in allocation_data
              if isinstance(item, dict)
          ]

          print("=== SERVER ===")
          print(json.dumps({
              "name": server_attrs.get("name"),
              "identifier": server_attrs.get("identifier"),
              "node": server_attrs.get("node"),
              "status": server_attrs.get("status"),
              "docker_image": server_attrs.get("docker_image"),
              "disk_limit_mib": server_attrs.get("limits", {}).get("disk"),
              "backup_slots": server_attrs.get("feature_limits", {}).get("backups"),
              "allocated_ports": ports,
              "is_transferring": server_attrs.get("is_transferring"),
              "is_node_under_maintenance": server_attrs.get("is_node_under_maintenance"),
          }, ensure_ascii=False, sort_keys=True))

          print("=== RUNTIME ===")
          runtime = resource_data.get("resources", {})
          print(json.dumps({
              "state": resource_data.get("current_state"),
              "is_booting": resource_data.get("is_booting"),
              "memory_bytes": runtime.get("memory_bytes"),
              "cpu_percent": runtime.get("cpu_absolute"),
              "disk_bytes": runtime.get("disk_bytes"),
              "uptime_ms": runtime.get("uptime"),
          }, sort_keys=True))

          print("=== STARTUP ===")
          safe_values = {"MAIN_FILE", "PY_FILE", "SERVER_PORT", "ASHUR_DATA_DIR", "ASHUR_DASHBOARD_ALLOWED_ORIGINS"}
          variable_report = []
          for item in records(startup_data):
              name = item.get("env_variable", "")
              value = item.get("server_value")
              row = {
                  "name": name,
                  "is_editable": item.get("is_editable"),
                  "configured": value not in (None, ""),
              }
              if name in safe_values:
                  row["value"] = value
              variable_report.append(row)
          print(json.dumps({
              "raw_startup_command": startup_meta.get("raw_startup_command"),
              "docker_image_options": sorted((startup_meta.get("docker_images") or {}).keys()),
              "variables": variable_report,
              "sillydev_config_managed": startup_meta.get("sillydev") is not None,
          }, ensure_ascii=False, sort_keys=True))

          print("=== GIT DEPLOY ===")
          repository = git_data.get("repository") or {}
          config = git_data.get("config") or {}
          deploys = git_data.get("deployments", [])
          safe_deploys = []
          for item in deploys[:5] if isinstance(deploys, list) else []:
              commit = item.get("commit") or {}
              safe_deploys.append({
                  "branch": item.get("branch"),
                  "status": item.get("status"),
                  "trigger": item.get("trigger"),
                  "commit_sha": commit.get("sha"),
                  "created_at": item.get("created_at"),
              })
          repo_fields = (
              "source", "repository", "branch", "directory", "auto_deploy",
              "restart_on_deploy", "start_if_offline", "apply_config",
              "sync_startup", "disconnected", "last_deployed_at"
          )
          config_fields = ("state", "missing", "unsupported", "invalid", "version_outdated", "problems", "differs")
          print(json.dumps({
              "can_manage": git_data.get("can_manage"),
              "repository": {k: repository.get(k) for k in repo_fields if k in repository},
              "sillydev_config": {k: config.get(k) for k in config_fields if k in config},
              "recent_deployments": safe_deploys,
          }, ensure_ascii=False, sort_keys=True))

          print("=== PAPER WORKER EXPORT ===")
          if isinstance(worker_status, dict):
              health = worker_status.get("worker_health", {})
              accounts = worker_status.get("accounts", [])
              print(json.dumps({
                  "status_file_present": True,
                  "mode": worker_status.get("mode"),
                  "updated_at": worker_status.get("updated_at"),
                  "strategy_accounts": len(accounts) if isinstance(accounts, list) else None,
                  "all_strategies_ok": health.get("all_strategies_ok"),
                  "successful_strategies": health.get("successful_strategies"),
                  "error_count": health.get("error_count"),
                  "all_protections_ok": health.get("all_protections_ok"),
                  "protection_degraded_positions": health.get("protection_degraded_positions"),
                  "protection_degraded_strategies": health.get("protection_degraded_strategies"),
              }, ensure_ascii=False, sort_keys=True))
          else:
              print(json.dumps({"status_file_present": False, "path": status_path}))

          print("=== BACKUPS ===")
          if isinstance(backup_data, dict):
              backup_items = records(backup_data)
              print(json.dumps({
                  "backup_slots": server_attrs.get("feature_limits", {}).get("backups"),
                  "existing_backups": len(backup_items),
                  "successful_backups": sum(1 for item in backup_items if item.get("is_successful") is True),
              }, sort_keys=True))
          else:
              print(json.dumps({
                  "backup_slots": server_attrs.get("feature_limits", {}).get("backups"),
                  "backup_list_available": False,
              }, sort_keys=True))

          print("=== AUDIT SAFETY ===")
          print("READ_ONLY=true")
          print("POWER_ACTIONS=none")
          print("DEPLOY_ACTIONS=none")
          print("FILESYSTEM_WRITES=none")
          print("SECRETS_VALUES=never_printed")
          PY
