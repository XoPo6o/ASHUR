<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101522"><title>ASHUR · 01 · BABYLON INVENTORY</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet"><style>:root{--bg:#101522;--panel:#1b2634;--accent:#e6b75e;--accent2:#61d2c2;--line:#8c7047;--display:'Silkscreen', monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#eee;font:13px/1.5 Inter,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 50px}.hero{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.eyebrow{font:10px var(--display);color:var(--accent2);letter-spacing:2px}h1{font:clamp(18px,3vw,30px) var(--display);margin:10px 0;color:var(--accent)}.hero p{color:#a9b5bd;font-size:11px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}.tile{min-width:0;border:1px solid var(--line);background:var(--panel);padding:14px}.tile label{display:block;font:9px var(--display);color:#aab8c0}.tile b{font:18px 'IBM Plex Mono';display:block;margin-top:8px;overflow-wrap:anywhere}.sectionhead{margin:22px 0 10px;font:11px var(--display);color:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);padding:15px;margin-top:12px;overflow:hidden}h2{font:11px var(--display);margin:0 0 12px}#curve{width:100%;height:auto;min-height:130px}#curve text{fill:#9baab2;font:10px 'IBM Plex Mono'}table{width:100%;border-collapse:collapse;font:10px 'IBM Plex Mono';overflow:auto}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:#9daeb5;font-size:9px}td{color:#e5e9e7}.inventory{margin-bottom:14px}.strategy{min-width:0}.grade{overflow-wrap:anywhere}.stats span{min-width:0}.up{color:#65d69a}.down{color:#ef7777}#foot{margin-top:18px;color:#81919a;font:9px 'IBM Plex Mono';overflow-wrap:anywhere}@media(max-width:760px){.wrap{width:calc(100% - 18px);padding-top:14px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.tile{padding:11px}.tile b{font-size:15px}.hero{align-items:flex-start}.hero p{font-size:10px}.inventory{grid-template-columns:1fr 1fr!important}.strategy{padding:10px}.strategyname{font-size:9px!important}.stats{font-size:8px!important;grid-template-columns:1fr 1fr!important}.panel{padding:11px}table{font-size:9px}}@media(max-width:420px){.inventory{grid-template-columns:1fr!important}.tile label{font-size:8px}}body{background:radial-gradient(ellipse at top,#33445b,#101522 70%);color:#f4e7ca}.hero{border-bottom:3px double #8c7047}.tile,.panel,.strategy{background:linear-gradient(145deg,#283849,#182330);border:2px solid #8c7047;box-shadow:inset 0 0 0 3px #111b27,4px 4px #090e16}.tile i{font-size:25px}.tile b{color:#f4c96e}.inventory{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.strategy{padding:14px}.itemicon{font-size:28px;color:#e6b75e}.strategyname{font:11px/1.7 'IBM Plex Mono',monospace}.grade{color:#69d2c4}.seal{border:3px double #e6b75e;border-radius:50%;width:76px;height:76px;display:grid;place-content:center;text-align:center;font-size:24px;color:#e6b75e}.seal small{font:9px 'IBM Plex Mono'}.sectionhead,h2{color:#f1ca79;font-size:12px;letter-spacing:1px}.panel{padding:18px;margin-top:14px}.tile{padding:15px}.tile label{font-size:9px;color:#b8c4c8}.tile b{display:block;font:17px 'IBM Plex Mono';margin-top:8px}.strategy .bigval{font:18px 'IBM Plex Mono';margin:10px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;font:9px 'IBM Plex Mono';color:#a9b7be}.stats b{color:#f4e7ca}.up{color:#67d6a1}.down{color:#f07a75}</style></head><body><main class="wrap"><div class='hero'><div><div class='eyebrow'>KI.LAM · MERCHANT GUILD</div><h1>ИНВЕНТАРЬ ИМПЕРИИ</h1><p>Казна торговца · шесть хранителей рынка</p></div><div class='seal'>𒀭<small>ASHUR</small></div></div><section class='kpis'><article class='tile'><i>🪙</i><label>ЗОЛОТОЙ ЗАПАС</label><b id='equity'>—</b></article><article class='tile'><i>💰</i><label>ЧИСТАЯ ПРИБЫЛЬ</label><b id='pnl'>—</b></article><article class='tile'><i>📜</i><label>ЗАКРЫТЫЕ СДЕЛКИ</label><b id='closed'>—</b></article><article class='tile'><i>🧪</i><label>ОТКРЫТЫЕ ПОЗИЦИИ</label><b id='open'>—</b></article></section><div class='sectionhead'>✦ ШЕСТЬ АРТЕФАКТОВ · СТРАТЕГИИ</div><section id='strategies' class='inventory'></section><section class='panel'><h2>КАРТА КАЗНЫ</h2><svg id='curve' viewBox='0 0 700 200'></svg></section><section class='panel'><h2>ТОРГОВЫЙ СВИТОК</h2><table><thead><tr><th>ПАРА</th><th>СТРАТЕГИЯ</th><th>P&amp;L</th><th>ПРИЧИНА</th></tr></thead><tbody id='trades'></tbody></table></section><div id="foot"></div><div style="margin-top:18px"><a href="index.html" style="color:var(--accent2);font:10px 'IBM Plex Mono'">← ВСЕ ПЯТЬ КОНЦЕПЦИЙ</a></div></main><script>const $=s=>document.querySelector(s), fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}), signed=n=>(n>0?'+':'')+fmt(n), esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{
 const [d,h]=await Promise.all([fetch('../wall-data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('../wall-history.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json())]);
 const eq=d.accounts.reduce((a,x)=>a+Number(x.equity||0),0), pnl=d.accounts.reduce((a,x)=>a+Number(x.net_pnl||0),0), closed=d.ledger?.total_closed_trades??d.closed_trades?.length??0, open=d.open_positions?.length??0;
 $('#equity').textContent=fmt(eq)+' USDT';$('#pnl').textContent=signed(pnl)+' USDT';$('#closed').textContent=closed;$('#open').textContent=open;
 $('#pnl').className='v '+(pnl>=0?'up':'down');if($('#mode'))$('#mode').textContent=d.mode==='PAPER_ONLY'?'PAPER ONLY':'CHECK MODE';
 if($('#stamp'))$('#stamp').textContent='DATA '+new Date(d.generated_at).toLocaleString();if($('#health'))$('#health').textContent=(d.worker_health?.successful_strategies??0)+'/6 ACTIVE · '+(d.worker_health?.error_count??0)+' ERRORS';
 $('#strategies').innerHTML=d.accounts.map((a,i)=>{const s=(d.trade_stats||[]).find(x=>x.strategy_id===a.strategy_id)||{};return `<article class="strategy"><div class="itemicon">${['◈','✦','⬡','⚒','☼','◆'][i]}</div><div class="strategyname">${esc(a.strategy_id)}</div><div class="grade">${esc(a.grade||'UNRATED')}</div><div class="bigval ${a.net_pnl>=0?'up':'down'}">${signed(a.net_pnl)} <small>USDT</small></div><div class="stats"><span>RETURN <b>${fmt(a.return_pct)}%</b></span><span>TRADES <b>${a.trades??0}</b></span><span>MAX DD <b>—</b></span><span>WIN RATE <b>${s.win_rate_pct==null?'—':fmt(s.win_rate_pct)+'%'}</b></span></div></article>`}).join('');
 const pts=h.points||[]; if(pts.length>1){const vals=pts.map(p=>Number(p.total_equity)),lo=Math.min(...vals),hi=Math.max(...vals),range=Math.max(hi-lo,0.01);const coords=vals.map((v,i)=>`${24+i*652/(vals.length-1)},${174-(v-lo)/range*138}`).join(' ');$('#curve').innerHTML=`<polyline points="${coords}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="18">OBSERVED SNAPSHOTS · ${pts.length} POINTS</text>`;}else{$('#curve').innerHTML='<text x="24" y="90">COLLECTING VERIFIED HISTORY…</text>'}
 $('#trades').innerHTML=(d.closed_trades||[]).length?(d.closed_trades||[]).map(t=>`<tr><td>${esc(t.symbol)}</td><td>${esc(t.strategy_id)}</td><td>${signed(t.pnl)}</td><td>${esc(t.reason)}</td></tr>`).join(''):'<tr><td colspan="4">NO CLOSED TRADES YET</td></tr>';
 $('#foot').textContent='BASELINE '+esc(d.experiment?.baseline_id)+' · HISTORY FROM '+(h.history_started_at?new Date(h.history_started_at).toLocaleString():'—')+' · UPDATED '+new Date(d.generated_at).toLocaleString();
 }catch(e){if($('#mode'))$('#mode').textContent='DATA FEED ERROR';if($('#stamp'))$('#stamp').textContent='Could not load verified data';console.error(e)}}
load();setInterval(load,60000);</script></body></html>
