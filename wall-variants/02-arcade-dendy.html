<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11152a"><title>ASHUR · 02 · ARCADE DENDY</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet"><style>:root{--bg:#11152a;--panel:#222b4b;--accent:#ffcc4d;--accent2:#63e6d4;--line:#7787c8;--display:'Press Start 2P', monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#eee;font:13px/1.5 Inter,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 50px}.hero{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.eyebrow{font:10px var(--display);color:var(--accent2);letter-spacing:2px}h1{font:clamp(18px,3vw,30px) var(--display);margin:10px 0;color:var(--accent)}.hero p{color:#a9b5bd;font-size:11px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}.tile{min-width:0;border:1px solid var(--line);background:var(--panel);padding:14px}.tile label{display:block;font:9px var(--display);color:#aab8c0}.tile b{font:18px 'IBM Plex Mono';display:block;margin-top:8px;overflow-wrap:anywhere}.sectionhead{margin:22px 0 10px;font:11px var(--display);color:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);padding:15px;margin-top:12px;overflow:hidden}h2{font:11px var(--display);margin:0 0 12px}#curve{width:100%;height:auto;min-height:130px}#curve text{fill:#9baab2;font:10px 'IBM Plex Mono'}table{width:100%;border-collapse:collapse;font:10px 'IBM Plex Mono';overflow:auto}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:#9daeb5;font-size:9px}td{color:#e5e9e7}.inventory{margin-bottom:14px}.strategy{min-width:0}.grade{overflow-wrap:anywhere}.stats span{min-width:0}.up{color:#65d69a}.down{color:#ef7777}#foot{margin-top:18px;color:#81919a;font:9px 'IBM Plex Mono';overflow-wrap:anywhere}@media(max-width:760px){.wrap{width:calc(100% - 18px);padding-top:14px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.tile{padding:11px}.tile b{font-size:15px}.hero{align-items:flex-start}.hero p{font-size:10px}.inventory{grid-template-columns:1fr 1fr!important}.strategy{padding:10px}.strategyname{font-size:9px!important}.stats{font-size:8px!important;grid-template-columns:1fr 1fr!important}.panel{padding:11px}table{font-size:9px}}@media(max-width:420px){.inventory{grid-template-columns:1fr!important}.tile label{font-size:8px}}body{background:radial-gradient(#28345a 1px,transparent 1px),linear-gradient(135deg,#10152a,#171d3a);background-size:16px 16px,auto;color:#f5f3e8}.hero{border:3px solid var(--line);padding:18px;background:#171e3b;box-shadow:5px 5px #070a16}.tile,.panel,.strategy{border:3px solid var(--line);background:#20294a;box-shadow:4px 4px #080b18}.tile{position:relative;padding:15px 12px}.tile i{position:absolute;right:12px;top:12px;font-size:22px}.tile label{font:8px 'Press Start 2P';color:#aab7e7}.tile b{display:block;font:13px 'IBM Plex Mono';color:#ffcf58;margin-top:13px;overflow-wrap:anywhere}.inventory{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.strategy{padding:13px}.itemicon{float:right;font-size:27px;color:#ffcf58}.strategyname{font:7px/2 'Press Start 2P';overflow-wrap:anywhere}.grade{font:9px 'IBM Plex Mono';color:#63e6d4;margin:8px 0}.strategy .bigval{font:16px 'IBM Plex Mono';margin:10px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font:9px 'IBM Plex Mono';color:#aab7e7}.stats b{display:block;color:white;margin-top:3px}.level{border:3px solid var(--accent);padding:10px;color:var(--accent);font:9px 'Press Start 2P';text-align:center}.level b{display:block;font-size:22px;margin:8px}.level small{font:7px 'IBM Plex Mono'}.sectionhead,h2{font:9px/2 'Press Start 2P';color:#ffcf58}.panel{padding:16px;margin-top:12px}.up{color:#7ae5a8}.down{color:#ff777b}</style></head><body><main class="wrap"><div class='hero'><div><div class='eyebrow'>PLAYER 01 · PAPER QUEST</div><h1>ASHUR / LEVEL 01</h1><p>30-DAY TRADING QUEST · BASELINE V2</p></div><div class='level'>LVL <b>01</b><small>EXPERIMENT</small></div></div><section class='kpis'><article class='tile'><label>COINS</label><b id='equity'>—</b><i>🪙</i></article><article class='tile'><label>SCORE / P&amp;L</label><b id='pnl'>—</b><i>⭐</i></article><article class='tile'><label>QUESTS DONE</label><b id='closed'>—</b><i>🏆</i></article><article class='tile'><label>ACTIVE QUESTS</label><b id='open'>—</b><i>🧪</i></article></section><div class='sectionhead'>[ PARTY ] SIX STRATEGY CHARACTERS</div><section id='strategies' class='inventory'></section><section class='panel'><h2>WORLD PROGRESS / EQUITY</h2><svg id='curve' viewBox='0 0 700 200'></svg></section><section class='panel'><h2>EVENT LOG / TRADES</h2><table><thead><tr><th>PAIR</th><th>PLAYER</th><th>SCORE</th><th>EVENT</th></tr></thead><tbody id='trades'></tbody></table></section><div id="foot"></div><div style="margin-top:18px"><a href="index.html" style="color:var(--accent2);font:10px 'IBM Plex Mono'">← ВСЕ ПЯТЬ КОНЦЕПЦИЙ</a></div></main><script>
const $=s=>document.querySelector(s), fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}), signed=n=>(n>0?'+':'')+fmt(n), esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{
 const [d,h]=await Promise.all([fetch('../wall-data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('../wall-history.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json())]);
 const eq=d.accounts.reduce((a,x)=>a+Number(x.equity||0),0), pnl=d.accounts.reduce((a,x)=>a+Number(x.net_pnl||0),0), closed=d.ledger?.total_closed_trades??d.closed_trades?.length??0, open=d.open_positions?.length??0;
 $('#equity').textContent=fmt(eq)+' USDT';$('#pnl').textContent=signed(pnl)+' USDT';$('#closed').textContent=closed;$('#open').textContent=open;
 $('#pnl').className='v '+(pnl>=0?'up':'down');$('#mode').textContent=d.mode==='PAPER_ONLY'?'PAPER ONLY':'CHECK MODE';
 $('#stamp').textContent='DATA '+new Date(d.generated_at).toLocaleString();$('#health').textContent=(d.worker_health?.successful_strategies??0)+'/6 ACTIVE · '+(d.worker_health?.error_count??0)+' ERRORS';
 $('#strategies').innerHTML=d.accounts.map((a,i)=>{const s=(d.trade_stats||[]).find(x=>x.strategy_id===a.strategy_id)||{};return `<article class="strategy"><div class="itemicon">${['◈','✦','⬡','⚒','☼','◆'][i]}</div><div class="strategyname">${esc(a.strategy_id)}</div><div class="grade">${esc(a.grade||'UNRATED')}</div><div class="bigval ${a.net_pnl>=0?'up':'down'}">${signed(a.net_pnl)} <small>USDT</small></div><div class="stats"><span>RETURN <b>${fmt(a.return_pct)}%</b></span><span>TRADES <b>${a.trades??0}</b></span><span>MAX DD <b>—</b></span><span>WIN RATE <b>${s.win_rate_pct==null?'—':fmt(s.win_rate_pct)+'%'}</b></span></div></article>`}).join('');
 const pts=h.points||[]; if(pts.length>1){const vals=pts.map(p=>Number(p.total_equity)),lo=Math.min(...vals),hi=Math.max(...vals),range=Math.max(hi-lo,0.01);const coords=vals.map((v,i)=>`${24+i*652/(vals.length-1)},${174-(v-lo)/range*138}`).join(' ');$('#curve').innerHTML=`<polyline points="${coords}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="18">OBSERVED SNAPSHOTS · ${pts.length} POINTS</text>`;}else{$('#curve').innerHTML='<text x="24" y="90">COLLECTING VERIFIED HISTORY…</text>'}
 $('#trades').innerHTML=(d.closed_trades||[]).length?(d.closed_trades||[]).map(t=>`<tr><td>${esc(t.symbol)}</td><td>${esc(t.strategy_id)}</td><td>${signed(t.pnl)}</td><td>${esc(t.reason)}</td></tr>`).join(''):'<tr><td colspan="4">NO CLOSED TRADES YET</td></tr>';
 $('#foot').textContent='BASELINE '+esc(d.experiment?.baseline_id)+' · HISTORY FROM '+(h.history_started_at?new Date(h.history_started_at).toLocaleString():'—')+' · UPDATED '+new Date(d.generated_at).toLocaleString();
 }catch(e){$('#mode').textContent='DATA FEED ERROR';$('#stamp').textContent='Could not load verified data';}}
load();setInterval(load,60000);
</script></body></html>
